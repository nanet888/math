<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math practice</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFBF7;--grid:#DCE6F0;--ink:#1F3A93;--text:#1B2230;--muted:#5A6477;--hl:#FFE45C;--card:#FFFFFF;--line:#C9D4E3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141C28;--grid:#1F2B3D;--ink:#9DB7FF;--text:#E8EDF5;--muted:#A3AEC2;--hl:#D9B92E;--card:#1B2535;--line:#2E3C54}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--text);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2.2rem;color:var(--ink);margin:10px 0 18px}
a{display:block;text-decoration:none;color:var(--text);background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:16px 18px;margin-bottom:12px}
a b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.35rem;color:var(--ink)}
a span{color:var(--muted);font-size:.95rem}
a:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
</style>
</head>
<body><div class="wrap">
